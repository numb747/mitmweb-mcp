[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mitmweb-mcp"
dynamic = ["version"]
description = "An MCP server that reads the mitmweb session you are already watching — one UI, shared by you and your AI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mitmweb-mcp contributors" }]
keywords = [
    "mcp", "model-context-protocol", "mitmproxy", "mitmweb",
    "http", "proxy", "scraping", "web-scraping", "reverse-engineering",
    "security", "traffic-analysis", "claude",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    # 1.7 is the first release whose FastMCP accepts tool annotations, but 1.14 is the
    # first that actually imports this module: until then Tool.from_function probed each
    # parameter with a bare issubclass(), which raises on any annotation that is not a
    # plain class — and `from __future__ import annotations` makes every one of ours a
    # string. The old >=1.2 floor had never worked; 1.14 replaced the probe with
    # find_context_parameter(). The floor-check CI job holds this honest.
    "mcp>=1.14.0,<2",
    # Imported directly for the Field(description=...) parameter annotations that make
    # each argument self-describing in the tool schema. The floor tracks what mcp 1.14
    # itself requires (>=2.11, and >=2.12 on Python 3.14, via its own marker); claiming
    # plain >=2 here would be unresolvable and therefore untestable.
    "pydantic>=2.11.0",
    "httpx>=0.27",
    "curl_cffi>=0.7",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/numb747/mitmweb-mcp"
Repository = "https://github.com/numb747/mitmweb-mcp"
Issues = "https://github.com/numb747/mitmweb-mcp/issues"

[project.scripts]
mitmweb-mcp = "mitmweb_mcp.server:main"

[tool.hatch.version]
path = "src/mitmweb_mcp/server.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mitmweb_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",    # long lines are handled by the formatter, not worth failing CI over
    "SIM105",  # contextlib.suppress is not clearer than try/except here
]
