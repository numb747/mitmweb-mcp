name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  import-check:
    # Verifies the package installs cleanly and every tool registers, on all
    # supported Python versions. Cheap and needs no network beyond PyPI.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - run: python tests/check_tool_contract.py

  floor-check:
    # import-check always resolves the newest mcp, so it can never notice that the
    # declared lower bound is a fiction — which is exactly what >=1.2 turned out to be.
    # Install the floor exactly and make sure the server still comes up on it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e .
      - name: Install the oldest dependencies the package claims to support
        # pydantic is pinned alongside mcp because the argument-model hardening in
        # server.py rests on pydantic behaviour, and whatever pydantic is newest says
        # nothing about the oldest this package claims to accept. `pip check` is what
        # turns a pin that no longer matches the declared bound into a failure — pip
        # itself only prints an error and exits 0.
        run: |
          python tests/dependency_floors.py > /tmp/floor-pins.txt
          echo "Declared floors:"; cat /tmp/floor-pins.txt
          pip install -r /tmp/floor-pins.txt
          pip check
      - run: python tests/check_tool_contract.py

  e2e:
    # The full end-to-end suite drives a real mitmweb and reaches httpbingo.org.
    # mitmproxy is installed into its own venv rather than alongside this package:
    # it pulls in 60+ dependencies and we only need its binary, so isolating it
    # keeps a resolver conflict in that tree from failing the whole job.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package
        run: pip install -e .

      - name: Install mitmproxy in an isolated venv
        run: |
          python -m venv /tmp/mitmproxy-venv
          /tmp/mitmproxy-venv/bin/pip install --upgrade pip
          /tmp/mitmproxy-venv/bin/pip install mitmproxy
          /tmp/mitmproxy-venv/bin/mitmweb --version
          echo "TEST_MITMWEB=/tmp/mitmproxy-venv/bin/mitmweb" >> "$GITHUB_ENV"

      - name: Check the Chrome addon's bypass rules
        # Runs in the mitmproxy venv: contrib/chrome.py needs mitmproxy and nothing
        # else. Launches no browser. This is the only job with mitmproxy available.
        run: /tmp/mitmproxy-venv/bin/python tests/check_chrome_bypass.py

      - name: Run end-to-end tests
        run: python tests/test_e2e.py
