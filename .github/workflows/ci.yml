name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  import-check:
    # Verifies the package installs cleanly and every tool registers, on all
    # supported Python versions. Cheap and needs no network beyond PyPI.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - run: python tests/check_tool_contract.py

  floor-check:
    # import-check always resolves the newest mcp, so it can never notice that the
    # declared lower bound is a fiction — which is exactly what >=1.2 turned out to be.
    # Install the floor exactly and make sure the server still comes up on it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e .
      - name: Install the oldest mcp the package claims to support
        # Read the bound out of the installed metadata instead of repeating the literal
        # here: a hardcoded pin drifts silently the first time the floor is raised, and
        # pip would not object — installing a version the package excludes only prints
        # an error and still exits 0. `pip check` is what turns that into a failure.
        run: |
          floor=$(python - <<'PY'
          import re
          from importlib.metadata import requires
          req = next(r for r in requires("mitmweb-mcp") if re.match(r"mcp\b", r))
          print(re.search(r">=\s*([\d.]+)", req).group(1))
          PY
          )
          echo "Declared floor: mcp==$floor"
          pip install "mcp==$floor"
          pip check
      - run: python tests/check_tool_contract.py

  e2e:
    # The full end-to-end suite drives a real mitmweb and reaches httpbingo.org.
    # mitmproxy is installed into its own venv rather than alongside this package:
    # it pulls in 60+ dependencies and we only need its binary, so isolating it
    # keeps a resolver conflict in that tree from failing the whole job.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package
        run: pip install -e .

      - name: Install mitmproxy in an isolated venv
        run: |
          python -m venv /tmp/mitmproxy-venv
          /tmp/mitmproxy-venv/bin/pip install --upgrade pip
          /tmp/mitmproxy-venv/bin/pip install mitmproxy
          /tmp/mitmproxy-venv/bin/mitmweb --version
          echo "TEST_MITMWEB=/tmp/mitmproxy-venv/bin/mitmweb" >> "$GITHUB_ENV"

      - name: Run end-to-end tests
        run: python tests/test_e2e.py
